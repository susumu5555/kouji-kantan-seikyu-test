<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1457a6">
<title>工事管理アプリ</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#172033;background:#f4f6f9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
header{background:#1457a6;color:#fff;padding:20px 18px;box-shadow:0 2px 8px #0002}
h1{font-size:21px;margin:0;font-weight:750}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:10px}.build-version{font-size:11px;color:#dce9f7;border:1px solid #ffffff70;border-radius:7px;padding:5px 8px;white-space:nowrap}
main{max-width:680px;margin:0 auto;padding:26px 18px 40px}
button{font:inherit;color:inherit;cursor:pointer}
.new{width:100%;min-height:112px;background:#fff;border:2px solid #3981c7;border-radius:16px;color:#1457a6;font-size:25px;font-weight:750;box-shadow:0 2px 8px #0000000a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
.tile{min-height:145px;background:#fff;border:1px solid #dce2ea;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:700;box-shadow:0 2px 7px #00000009}
.tile:active,.new:active,.backup:active{transform:scale(.99);background:#edf4fc}
.backup{width:100%;min-height:66px;margin-top:18px;background:#fff;border:1px solid #dce2ea;border-radius:14px;color:#1457a6;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 7px #00000009}
.icon{width:35px;height:35px;display:block}
.notice{margin:22px 2px 0;color:#657184;font-size:12px;line-height:1.7;text-align:center}
@media(max-width:360px){.grid{gap:12px}.tile{font-size:17px;min-height:128px}}
</style>
</head>
<body>
<header><div class="header-inner"><h1>工事管理アプリ</h1><span class="build-version">開発版 v186</span></div></header>
<main>
<button class="new" type="button" data-feature="現場登録">＋ 現場登録</button>
<section class="grid" aria-label="メニュー">
<button class="tile" type="button" data-feature="未完了現場">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 9h.01M15 9h.01"/></svg>
<span>未完了現場</span></button>
<button class="tile" type="button" data-feature="工事完了履歴">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8 12l2.5 2.5L16 9"/></svg>
<span>工事完了履歴</span></button>
<button class="tile" type="button" data-feature="工事日確認">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h3"/></svg>
<span>工事日確認</span></button>
<button class="tile" type="button" data-feature="見積作成">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h8l4 4v14H7zM15 3v5h5M10 13h6M10 17h6"/></svg>
<span>見積作成</span></button>
</section>
<button class="backup" type="button" data-feature="バックアップ">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg>
<span>バックアップ</span>
</button>
<button class="backup" type="button" data-feature="共有設定">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.2 2.5-5.5 6-5.5s6 2.3 6 5.5M15 15c3.5-.3 6 1.5 6 4"/></svg>
<span>共有設定</span>
</button>
<p class="notice">現場データはログイン後にクラウドへ同期されます。写真PDFは新規保存時にクラウドへ保存され、別端末から開けます。</p>
</main>
<script>
document.querySelectorAll('[data-feature]').forEach(button=>{
  button.addEventListener('click',()=>{
    const routes={'現場登録':'./field-register.html?page=register','未完了現場':'./field-register.html?page=cases','工事完了履歴':'./field-register.html?list=completed','工事日確認':'./field-register.html?page=schedule','見積作成':'./invoice.html','共有設定':'./shared-setup.html'};if(routes[button.dataset.feature]){location.href=routes[button.dataset.feature];return;}if(button.dataset.feature==='バックアップ'){const raw=localStorage.getItem('genbaThreeModule_v1');if(!raw){alert('このブラウザーに現場データがありません。');return;}const blob=new Blob([raw],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='工事管理バックアップ.json';a.click();URL.revokeObjectURL(url);return;}alert('この機能は現在利用できません。');
  });
});
</script>
</body>
</html>
