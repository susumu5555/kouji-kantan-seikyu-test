<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1457a6">
<title>住所入力テスト | 工事管理アプリ</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#172033;background:#f4f6f9}
*{box-sizing:border-box}body{margin:0}header{background:#1457a6;color:white;padding:18px}h1{font-size:20px;margin:0}main{max-width:680px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid #dce2ea;border-radius:16px;padding:18px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 14px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input,select{width:100%;min-height:46px;border:1px solid #cbd3df;border-radius:10px;padding:11px;font:inherit;background:#fff}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 15px;font-weight:700}
.primary{background:#1457a6;color:#fff}.secondary{background:#eaf2fc;color:#1457a6}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.status{font-size:13px;line-height:1.6;margin-top:10px;color:#526071;min-height:22px}
.small{font-size:12px;color:#657184;line-height:1.6}.hidden{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
@media(max-width:430px){.row{grid-template-columns:1fr}.row button{width:100%}}
</style>
</head>
<body>
<header><h1>工事管理アプリ｜住所入力テスト</h1></header>
<main>
<section class="card">
<h2>① 郵便番号から自動入力</h2>
<div class="row">
<div><label for="zipcode">郵便番号</label><input id="zipcode" inputmode="numeric" autocomplete="postal-code" maxlength="8" placeholder="例：812-0011"></div>
<button class="primary" id="search" type="button">住所を検索</button>
</div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div id="multipleWrap" class="hidden"><label for="multiple">検索結果（複数ある場合）</label><select id="multiple"></select></div>
</section>
<section class="card">
<h2>② 住所（検索後も修正できます）</h2>
<label for="prefecture">都道府県</label>
<select id="prefecture"><option value="">都道府県を選択</option></select>
<label for="city">市区町村</label><input id="city" autocomplete="address-level2" placeholder="例：福岡市博多区">
<label for="town">町域</label><input id="town" autocomplete="address-level3" placeholder="例：博多駅前">
<label for="street">番地</label><input id="street" autocomplete="street-address" placeholder="例：2丁目1-1">
<label for="building">建物名・部屋番号</label><input id="building" placeholder="任意">
<p class="small">郵便番号が不明な場合は、都道府県を選択して住所を手入力できます。郵便番号検索では都道府県・市区町村・町域までを入力し、番地以降は手入力します。</p>
<div class="actions"><button class="secondary" id="clear" type="button">入力をクリア</button></div>
</section>
<section class="card">
<h2>テスト確認</h2>
<p class="small">検索例：8120011（福岡県福岡市博多区博多駅前）／1000004（東京都千代田区大手町）。検索結果は住所データに基づき表示します。</p>
<p class="small">この画面は住所検索の動作確認用です。入力内容は保存・送信しません。検索時に郵便番号を外部の住所検索サービスへ送信します。</p>
</section>
</main>
<script>
const prefectures=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
const $=id=>document.getElementById(id);
prefectures.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;$('prefecture').appendChild(o)});
let results=[];
function setStatus(s){$('status').textContent=s}
function applyResult(r){$('prefecture').value=r.address1||'';$('city').value=r.address2||'';$('town').value=r.address3||'';setStatus('住所を入力しました。番地・建物名を確認して入力してください。')}
function chooseResults(list){
 results=list||[];
 $('multipleWrap').classList.toggle('hidden',results.length<2);
 $('multiple').innerHTML='';
 results.forEach((r,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=[r.address1,r.address2,r.address3].filter(Boolean).join('');$('multiple').appendChild(o)});
 if(results.length)applyResult(results[0]);
}
$('multiple').addEventListener('change',()=>applyResult(results[Number($('multiple').value)]));
$('search').addEventListener('click',()=>{
 const zip=$('zipcode').value.replace(/[^0-9]/g,'');
 if(!/^\d{7}$/.test(zip)){setStatus('郵便番号は7桁で入力してください。');return}
 $('search').disabled=true;setStatus('住所を検索しています…');
 const cb='zipcb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
 const script=document.createElement('script');let done=false;
 const timer=setTimeout(()=>finish(null,'検索がタイムアウトしました。時間をおいて再試行してください。'),15000);
 function finish(data,error){
  if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();$('search').disabled=false;
  if(error){setStatus(error);return}
  if(!data||data.status!==200){setStatus(data?.message||'住所検索に失敗しました。');return}
  if(!data.results||!data.results.length){setStatus('該当する住所が見つかりません。郵便番号を確認するか、手入力してください。');return}
  chooseResults(data.results);setStatus(data.results.length>1?'複数の住所候補があります。該当する町域を選択してください。':'住所を取得しました。');
 }
 window[cb]=data=>finish(data,null);
 script.onerror=()=>finish(null,'住所検索サービスに接続できませんでした。');
 script.src='https://zipcloud.ibsnet.co.jp/api/search?zipcode='+encodeURIComponent(zip)+'&callback='+encodeURIComponent(cb);
 document.head.appendChild(script);
});
$('clear').addEventListener('click',()=>{
 ['zipcode','city','town','street','building'].forEach(id=>$(id).value='');
 $('prefecture').value='';$('multipleWrap').classList.add('hidden');setStatus('');
});
</script>
</body>
</html>
