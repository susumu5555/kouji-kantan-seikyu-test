<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f59">
<title>現場管理アプリ</title>
<style>
:root{--navy:#173f59;--blue:#245b78;--bg:#f3f5f7;--line:#dce2e6;--muted:#66747d;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1c2930;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{background:var(--navy);color:#fff;padding:20px 18px 18px}.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{font-size:22px;margin:0}header p{margin:0;color:#d4e0e7;font-size:13px}.home-button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:42px;padding:9px 13px;border:1px solid #ffffff99;border-radius:10px;color:#fff;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}.home-button:active{background:#ffffff25}@media(max-width:380px){.home-button{font-size:11px;padding:8px 9px}}
main{max-width:900px;margin:0 auto;padding:16px}
.notice{background:#fff8e7;border:1px solid #ead9a8;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.65;margin-bottom:14px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.nav button{border:0;border-radius:12px;background:#dce8ee;color:var(--navy);padding:13px 5px;font-weight:700;font-size:14px}
.nav button.active{background:var(--navy);color:white}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.home-action{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:14px;background:#e8f0f4;color:var(--navy);padding:18px 10px;min-height:116px}.home-action span{font-size:27px}.home-action b{font-size:15px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:18px 0 9px}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}
input,textarea,select{width:100%;border:1px solid #cbd4d9;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#1c2930}
input.auto-filled,select.auto-filled{background:#e8f3ff;border-color:#3985d6;box-shadow:inset 0 0 0 1px rgba(57,133,214,.16)}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.primary,.action{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700}
button.secondary{background:#e8eef1;color:var(--navy);border:0;border-radius:10px;padding:11px 14px;font-weight:650}
button.danger{background:#fff0ef;color:#a3342b;border:1px solid #f0cbc7;border-radius:9px;padding:8px 11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}
.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item strong{font-size:15px}.sub{font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px}
.pill{font-size:11px;background:#edf3f6;color:#31566b;border-radius:20px;padding:4px 8px;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:15px 2px}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.calendar-head strong{font-size:18px}
.calendar-head button{min-width:42px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calendar-weekday{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:7px 0}
.calendar-day{position:relative;min-height:66px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:6px 2px 4px;text-align:center;color:#1c2930}
.calendar-day .daynum{font-size:14px;font-weight:650}
.calendar-day.today{border:2px solid var(--blue)}
.calendar-day.selected{background:#e7f1f8;border:2px solid var(--navy)}
.calendar-day.other{opacity:.35}
.calendar-day .event-count{display:block;margin:3px auto 0;font-size:10px;color:var(--navy);font-weight:700;white-space:nowrap}
.calendar-day.has-events:after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:#2675ad;margin:2px auto 0}
.calendar-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.calendar-legend span{display:flex;align-items:center;gap:5px}
.calendar-legend i{width:8px;height:8px;border-radius:50%;background:#2675ad;display:inline-block}
.day-heading{font-size:16px;font-weight:750;margin:0 0 8px}
.event-type{font-size:11px;border-radius:20px;background:#eaf1f5;color:#245b78;padding:4px 8px;white-space:nowrap}
@media(max-width:420px){.calendar-day{min-height:56px}.calendar-day .event-count{font-size:9px}.calendar-grid{gap:3px}}

@media(max-width:560px){.home-grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}main{padding:12px}}
</style></head>
<body>
<header><div class="header-inner"><h1>現場管理アプリ</h1><a class="home-button" href="./" aria-label="ホームに戻る">← ホームに戻る</a></div></header>
<main>


<section id="register" class="page hidden">

<div class="panel">
<h2>新規登録</h2>
<div class="row"><div><label>現場名 *</label><input id="pName" placeholder="例：山田様 エアコン取付"></div><div><label>顧客名</label><input id="pCustomer" placeholder="例：山田様"></div></div>
<div class="row"><div><label for="pZip">郵便番号</label><input id="pZip" inputmode="numeric" maxlength="8" autocomplete="postal-code" placeholder="例：812-0011"></div><div style="display:flex;align-items:end"><button class="secondary" id="pZipSearch" type="button" style="width:100%">住所を自動入力</button></div></div>
<div id="pZipStatus" class="small" role="status" aria-live="polite"></div>
<label for="pPref">都道府県</label><select id="pPref"><option value="">都道府県を選択</option></select>
<label for="pAddress">市区町村・町域・番地・建物名</label><input id="pAddress" autocomplete="street-address" placeholder="例：福岡市博多区博多駅前1-2-3 〇〇マンション101号">
<label for="pAssignee">現場担当者</label><input id="pAssignee" placeholder="担当者名">
<label>工事施工日</label><input id="pWorkDate" type="date">
<div class="actions"><button class="primary" id="saveProject">現場を登録</button><button class="secondary" onclick="location.href='./'">ホームへ戻る</button></div>
</div>
<div class="panel">
<h2>工事予定を登録</h2>
<label>現場</label><select id="sProject"></select>
<div class="row"><div><label>予定日 *</label><input id="sDate" type="date"></div><div><label>開始時刻</label><input id="sTime" type="time"></div></div>
<label>予定区分</label><select id="sType"><option>現地調査</option><option>工事</option><option>修理</option><option>再訪問</option><option>その他</option></select>
<label>予定内容</label><textarea id="sContent" placeholder="作業内容・持参品など"></textarea>
<div class="actions"><button class="primary" id="saveSchedule">予定を登録</button></div>
</div>
</section>

<section id="cases" class="page hidden">

<div class="panel">
<h2 id="casesTitle">未完了現場</h2>
<h3>登録済み現場</h3>
<p class="small">登録日の新しい順に20件ずつ表示します。21～40件目以降は「次へ」で切り替えます。</p>
<input id="projectSearch" placeholder="現場名・顧客名・住所で検索">
<div id="projectList"></div>
<div id="projectPagination" class="actions" aria-label="現場一覧ページ切替"></div>
</div>
</section>

<section id="ledger" class="page hidden">
<div class="actions"><button class="secondary" data-page="cases">← 案件・工事台帳に戻る</button></div>
<div class="panel">
<h2>工事台帳（寸法記録）</h2>
<div id="ledgerProjectHeading" class="small"></div>
<label>対象現場 *</label><select id="dProject"></select>
<div id="selectedProjectInfo" class="item empty">現場を選択すると、現場情報がここに表示されます。</div>
<div id="projectPdfList"></div>
<div id="pdfSaveStatus" class="small" aria-live="polite"></div>
<div class="actions"><button class="secondary" id="openCamera">写真を撮影（写真PDFメーカー）</button></div>

<div class="row"><div><label>記録日</label><input id="dDate" type="date"></div><div><label>記録項目</label><input id="dLabel" placeholder="例：配管長・穴位置"></div></div>
<div class="row"><div><label>寸法・数値</label><input id="dValue" placeholder="例：3.5"></div><div><label>単位</label><select id="dUnit"><option>m</option><option>mm</option><option>cm</option><option>台</option><option>個</option><option>その他</option></select></div></div>
<label>備考</label><textarea id="dMemo" placeholder="寸法の補足・施工上の注意"></textarea>
<div class="actions"><button class="primary" id="saveDimension">寸法を保存</button></div>
</div>
<div class="panel"><h2>寸法記録一覧</h2><div id="dimensionList"></div></div>

</section>

<section id="schedule" class="page hidden">
<div class="panel">
<h2>工事日カレンダー</h2>
<div class="calendar-head">
<button class="secondary" id="prevMonth" type="button" aria-label="前の月">‹</button>
<strong id="calendarMonth"></strong>
<button class="secondary" id="nextMonth" type="button" aria-label="次の月">›</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
<div class="calendar-legend"><span><i></i>予定あり</span><span>青枠：今日</span><span>薄青：選択日</span></div>
<div class="actions"><button class="secondary" id="calendarToday" type="button">今日に戻る</button></div>
</div>
<div class="panel">
<h3 class="day-heading" id="selectedDateHeading">選択日の予定</h3>
<div id="selectedDayEvents"></div>
</div>

</section>

</main>
<script src="./shared-auth-v3.js"></script>
<script>
const $=id=>document.getElementById(id), key='genbaThreeModule_v1';
const prefectures=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
prefectures.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;$('pPref').appendChild(o)});
$('pZipSearch').onclick=()=>{
 const zip=$('pZip').value.replace(/[^0-9]/g,'');
 if(!/^\d{7}$/.test(zip)){$('pZipStatus').textContent='郵便番号は7桁で入力してください。';return}
 const button=$('pZipSearch');button.disabled=true;$('pZipStatus').textContent='住所を検索しています…';
 const cb='genbaZip_'+Date.now()+'_'+Math.floor(Math.random()*100000),script=document.createElement('script');let done=false;
 const timer=setTimeout(()=>finish(null,'検索がタイムアウトしました。時間をおいて再試行してください。'),15000);
 function finish(data,error){if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();button.disabled=false;
  if(error){$('pZipStatus').textContent=error;return}
  if(!data||data.status!==200){$('pZipStatus').textContent=data?.message||'住所検索に失敗しました。';return}
  if(!data.results?.length){$('pZipStatus').textContent='該当する住所がありません。住所を手入力してください。';return}
  const r=data.results[0];$('pPref').value=r.address1||'';$('pAddress').value=[r.address2,r.address3].filter(Boolean).join('');$('pPref').classList.add('auto-filled');$('pAddress').classList.add('auto-filled');
  $('pZipStatus').textContent=data.results.length>1?'複数候補があります。最初の候補を入力しました。町域を確認してください。':'住所を入力しました。番地・建物名を確認してください。';
 }
 window[cb]=data=>finish(data,null);script.onerror=()=>finish(null,'住所検索サービスに接続できませんでした。');
 script.src='https://zipcloud.ibsnet.co.jp/api/search?zipcode='+encodeURIComponent(zip)+'&callback='+encodeURIComponent(cb);document.head.appendChild(script);
};
['pPref','pAddress'].forEach(id=>$(id).addEventListener('input',()=>$(id).classList.remove('auto-filled')));
$('pZip').addEventListener('input',()=>{ $('pPref').classList.remove('auto-filled');$('pAddress').classList.remove('auto-filled'); });
let db=JSON.parse(localStorage.getItem(key)||'{"projects":[],"visits":[],"dimensions":[],"schedules":[]}');
if(!Array.isArray(db.pdfs))db.pdfs=[];
let fieldCloudRevision=null,fieldCloudQueue=Promise.resolve(),fieldCloudReady=false;
const save=()=>{const snapshot=JSON.stringify(db);localStorage.setItem(key,snapshot);if(!fieldCloudReady)return;fieldCloudQueue=fieldCloudQueue.then(async()=>{const cloud=window.KoujiCloud;if(!cloud?.ready)throw Error('クラウド認証が切れています');const {data:result,error}=await cloud.client.rpc('save_shared_document',{p_document_key:'field_data',p_payload:JSON.parse(snapshot),p_expected_revision:fieldCloudRevision});if(error)throw error;const row=Array.isArray(result)?result[0]:result;if(!row?.revision)throw Error('クラウド保存結果を確認できません');fieldCloudRevision=Number(row.revision);localStorage.setItem('koujiFieldCloudRevision_v1',String(fieldCloudRevision));}).catch(err=>{console.error('Field cloud save failed',err);alert('端末には保存しましたが、現場データのクラウド同期に失敗しました。別端末にはまだ反映されていません。\\n'+(err.message||err));throw err});return fieldCloudQueue};
async function initializeFieldCloud(){if(!window.KoujiCloudReady)throw Error('共有ログイン機能を読み込めません。再読み込みしてください');const cloud=await window.KoujiCloudReady;if(!cloud?.ready)throw Error('クラウド認証を確認できません');const {data:doc,error}=await cloud.client.from('shared_documents').select('document_key,revision,payload').eq('document_key','field_data').maybeSingle();if(error)throw error;const raw=localStorage.getItem(key);if(raw&&!localStorage.getItem('koujiFieldData_preCloud_v1')){localStorage.setItem('koujiFieldData_preCloud_v1',raw);if(localStorage.getItem('koujiFieldData_preCloud_v1')!==raw)throw Error('同期前バックアップを保存できません。端末データを変更せず停止します')}if(doc){const localRevision=Number(localStorage.getItem('koujiFieldCloudRevision_v1')||0);if(localRevision>Number(doc.revision))throw Error('端末側の同期番号がクラウドより新しいため、自動上書きを停止しました');db=doc.payload;if(!db||typeof db!=='object'||!Array.isArray(db.projects)||!Array.isArray(db.visits)||!Array.isArray(db.dimensions)||!Array.isArray(db.schedules))throw Error('クラウド現場データの形式が不正です。端末データは保持しています');if(!Array.isArray(db.pdfs))db.pdfs=[];localStorage.setItem(key,JSON.stringify(db));fieldCloudRevision=Number(doc.revision)}else{const {data:result,error:saveError}=await cloud.client.rpc('save_shared_document',{p_document_key:'field_data',p_payload:db,p_expected_revision:0});if(saveError)throw saveError;const row=Array.isArray(result)?result[0]:result;if(!row?.revision)throw Error('現場データの初回登録結果を確認できません');fieldCloudRevision=Number(row.revision)}localStorage.setItem('koujiFieldCloudRevision_v1',String(fieldCloudRevision));fieldCloudReady=true;return fieldCloudRevision}
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const projectName=x=>db.projects.find(p=>p.id===x)?.name||'現場未登録';
function showPage(page){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!==page));render()}
const initialPage=new URLSearchParams(location.search).get('page');
const pageToShow=initialPage==='completed'?'cases':initialPage;
if(['register','cases','schedule','ledger'].includes(pageToShow)){document.getElementById(pageToShow).classList.remove('hidden');}
else{location.replace('./');}

document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='home'){location.href='./';return;}showPage(b.dataset.page)});
$('saveProject').onclick=()=>{let name=$('pName').value.trim();if(!name)return alert('現場名を入力してください');const address=[$('pPref').value,$('pAddress').value.trim()].filter(Boolean).join('');db.projects.push({id:id(),name,customer:$('pCustomer').value,address,postalCode:$('pZip').value.replace(/[^0-9]/g,''),assignee:$('pAssignee').value.trim(),workDate:$('pWorkDate').value,createdAt:new Date().toISOString()});save();projectPage=1;['pName','pCustomer','pZip','pAddress','pAssignee','pWorkDate'].forEach(x=>$(x).value='');$('pPref').value='';$('pZipStatus').textContent='';showPage('cases')};
window.toggleCompleted=function(pid){const p=db.projects.find(x=>x.id===pid);if(!p)return;p.completed=!p.completed;p.completedAt=p.completed?new Date().toISOString():null;save();render()};
let projectPage=1;
const PROJECTS_PER_PAGE=20;
function renderProjects(){
 const q=$('projectSearch').value.trim().toLowerCase();
 const sorted=[...db.projects].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
 const filtered=q?sorted.filter(p=>[p.name,p.customer,p.address,p.assignee].some(x=>(x||'').toLowerCase().includes(q))):sorted;
 const total=filtered.length;
 const pageCount=Math.max(1,Math.ceil(total/PROJECTS_PER_PAGE));
 if(projectPage>pageCount)projectPage=pageCount;
 if(projectPage<1)projectPage=1;
 const from=(projectPage-1)*PROJECTS_PER_PAGE;
 const pageItems=filtered.slice(from,from+PROJECTS_PER_PAGE);
 const showCompleted=new URLSearchParams(location.search).get('page')==='completed';
 const visibleItems=pageItems.filter(p=>Boolean(p.completed)===showCompleted);
 $('projectList').innerHTML=visibleItems.length?visibleItems.map(p=>`<div class="item"><div class="itemtop"><strong>${esc(p.name)}</strong><span class="pill">${esc(p.workDate||'施工日未設定')}</span></div><div class="sub">${esc(p.customer)}　${esc(p.address)}<br>現場担当者：${esc(p.assignee||'未設定')}<br>登録：${new Date(p.createdAt).toLocaleDateString('ja-JP')}</div><div class="actions"><button class="secondary" onclick="openLedger('${p.id}')">工事台帳</button><button class="secondary" onclick="toggleCompleted('${p.id}')">${showCompleted?'未完了に戻す':'工事完了にする'}</button></div></div>`).join(''):`<div class="empty">${showCompleted?'完了した現場はありません。':'未完了の現場はありません。'}</div>`;
 const end=Math.min(from+PROJECTS_PER_PAGE,total);
 $('projectPagination').innerHTML=total?`<span class="small" style="align-self:center">${from+1}～${end}件 / 全${total}件　（${projectPage}/${pageCount}ページ）</span><button class="secondary" ${projectPage===1?'disabled':''} onclick="changeProjectPage(-1)">前へ</button><button class="secondary" ${projectPage===pageCount?'disabled':''} onclick="changeProjectPage(1)">次へ</button>`:'';
}
window.changeProjectPage=function(delta){projectPage+=delta;renderProjects();window.scrollTo({top:0,behavior:'smooth'});};
window.openLedger=function(projectId){
 $('dProject').value=projectId;
 showPage('ledger');
};
$('projectSearch').oninput=()=>{projectPage=1;renderProjects()};
function renderSelectedProject(){
 const p=db.projects.find(x=>x.id===$('dProject').value);
 const box=$('selectedProjectInfo');
 $('ledgerProjectHeading').textContent=p?'対象現場：'+p.name:'';
 if(!p){box.className='item empty';box.textContent='現場を選択すると、現場情報がここに表示されます。';return;}
 box.className='item';
 box.innerHTML=`<strong>${esc(p.name)}</strong><div class="sub">顧客名：${esc(p.customer||'未登録')}<br>住所：${esc(p.address||'未登録')}<br>現場担当者：${esc(p.assignee||'未設定')}<br>工事施工日：${esc(p.workDate||'未設定')}<br>登録日：${new Date(p.createdAt).toLocaleDateString('ja-JP')}</div>`;
}
$('dProject').onchange=()=>{renderSelectedProject();renderDimensions();renderProjectPdfs();$('pdfSaveStatus').textContent=''};
function fillProjectSelects(){['dProject','sProject'].forEach(id=>{let old=$(id).value;$(id).innerHTML='<option value="">現場を選択</option>'+db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$(id).value=old})}
$('saveDimension').onclick=()=>{if(!$('dProject').value||!$('dLabel').value.trim())return alert('現場と記録項目を入力してください');db.dimensions.push({id:id(),projectId:$('dProject').value,date:$('dDate').value,label:$('dLabel').value,value:$('dValue').value,unit:$('dUnit').value,memo:$('dMemo').value,createdAt:new Date().toISOString()});save();['dDate','dLabel','dValue','dMemo'].forEach(x=>$(x).value='');render()};
function renderDimensions(){let selected=$('dProject').value;let a=[...db.dimensions].filter(d=>!selected||d.projectId===selected).sort((x,y)=>(y.date||'').localeCompare(x.date||''));$('dimensionList').innerHTML=a.length?a.map(d=>`<div class="item"><strong>${esc(projectName(d.projectId))}</strong><div class="sub">${esc(d.date)}　${esc(d.label)}：${esc(d.value)} ${esc(d.unit)}<br>${esc(d.memo)}</div></div>`).join(''):'<div class="empty">寸法記録はまだありません。</div>'}
let calendarMonth=new Date();calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1);
let selectedCalendarDate=new Date().toISOString().slice(0,10);
const pad2=n=>String(n).padStart(2,'0');
const dateKey=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function renderCalendar(){
 const year=calendarMonth.getFullYear(),month=calendarMonth.getMonth();
 $('calendarMonth').textContent=year+'年'+(month+1)+'月';
 const first=new Date(year,month,1),offset=(first.getDay()+6)%7;
 const start=new Date(year,month,1-offset);
 const weekdays=['月','火','水','木','金','土','日'];
 let html=weekdays.map(x=>'<div class="calendar-weekday">'+x+'</div>').join('');
 for(let i=0;i<42;i++){
  const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),keyDate=dateKey(d);
  const count=db.schedules.filter(x=>x.date===keyDate).length;
  const classes=['calendar-day'];
  if(d.getMonth()!==month)classes.push('other');
  if(keyDate===dateKey(new Date()))classes.push('today');
  if(keyDate===selectedCalendarDate)classes.push('selected');
  if(count)classes.push('has-events');
  html+='<button type="button" class="'+classes.join(' ')+'" data-calendar-date="'+keyDate+'"><span class="daynum">'+d.getDate()+'</span>'+(count?'<span class="event-count">'+count+'件</span>':'')+'</button>';
 }
 $('calendarGrid').innerHTML=html;
 $('calendarGrid').querySelectorAll('[data-calendar-date]').forEach(b=>b.onclick=()=>{selectedCalendarDate=b.dataset.calendarDate;const d=new Date(selectedCalendarDate+'T00:00:00');if(d.getMonth()!==calendarMonth.getMonth()||d.getFullYear()!==calendarMonth.getFullYear())calendarMonth=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar();renderSelectedDay();});
}
function renderSelectedDay(){
 const d=new Date(selectedCalendarDate+'T00:00:00');
 $('selectedDateHeading').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+['日','月','火','水','木','金','土'][d.getDay()]+'）の予定';
 const a=db.schedules.filter(x=>x.date===selectedCalendarDate).sort((x,y)=>(x.time||'').localeCompare(y.time||''));
 $('selectedDayEvents').innerHTML=a.length?a.map(x=>'<div class="item"><div class="itemtop"><strong>'+esc(x.time||'時刻未設定')+'　'+esc(projectName(x.projectId))+'</strong><span class="event-type">'+esc(x.type)+'</span></div><div class="sub">'+esc(x.content||'内容未入力')+'</div></div>').join(''):'<div class="empty">この日の予定はありません。</div>';
}
$('prevMonth').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCalendar()};
$('nextMonth').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCalendar()};
$('calendarToday').onclick=()=>{const d=new Date();calendarMonth=new Date(d.getFullYear(),d.getMonth(),1);selectedCalendarDate=dateKey(d);renderCalendar();renderSelectedDay()};
$('saveSchedule').onclick=()=>{if(!$('sDate').value)return alert('予定日を入力してください');db.schedules.push({id:id(),projectId:$('sProject').value,date:$('sDate').value,time:$('sTime').value,type:$('sType').value,content:$('sContent').value,createdAt:new Date().toISOString()});selectedCalendarDate=$('sDate').value;const d=new Date(selectedCalendarDate+'T00:00:00');calendarMonth=new Date(d.getFullYear(),d.getMonth(),1);save();['sDate','sTime','sContent'].forEach(x=>$(x).value='');renderCalendar();renderSelectedDay()};
function renderSchedules(){renderCalendar();renderSelectedDay()}
function render(){const title=document.getElementById('casesTitle');if(title)title.textContent=new URLSearchParams(location.search).get('page')==='completed'?'工事完了履歴':'未完了現場';fillProjectSelects();renderProjects();renderSelectedProject();renderDimensions();renderSchedules();renderProjectPdfs()}

const PHOTO_MAKER_ORIGIN='https://susumu5555.github.io';
const PHOTO_MAKER_URL=PHOTO_MAKER_ORIGIN+'/photo-pdf-app/';
let pdfDbPromise;
function openPdfDb(){
 if(pdfDbPromise)return pdfDbPromise;
 pdfDbPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open('genbaProjectPdfs',1);
  req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('pdfs'))d.createObjectStore('pdfs',{keyPath:'id'});};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
 return pdfDbPromise;
}
async function savePdfBlob(record){
 const d=await openPdfDb();
 return new Promise((resolve,reject)=>{
  const tx=d.transaction('pdfs','readwrite');tx.objectStore('pdfs').put(record);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
 });
}
async function getPdfRecord(id){
 const d=await openPdfDb();
 return new Promise((resolve,reject)=>{
  const req=d.transaction('pdfs','readonly').objectStore('pdfs').get(id);
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
function fmtBytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';}
function renderProjectPdfs(){
 const pid=$('dProject').value,box=$('projectPdfList');
 if(!pid){box.innerHTML='';return;}
 const list=(db.pdfs||[]).filter(x=>x.projectId===pid).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
 box.innerHTML='<h3>保存済み写真PDF</h3>'+(list.length?list.map(x=>`<div class="item"><div style="flex:1"><strong>${esc(x.fileName)}</strong><div class="sub">${new Date(x.createdAt).toLocaleString('ja-JP')} ・ ${esc(x.sizeLabel)}</div></div><button class="secondary" onclick="openSavedPdf('${x.id}')">開く</button></div>`).join(''):'<div class="empty">この現場に保存された写真PDFはありません。</div>');
}
window.openSavedPdf=async function(id){
 try{
  const meta=(db.pdfs||[]).find(x=>x.id===id);if(!meta)return alert('PDF情報が見つかりません');
  let record=await getPdfRecord(id);
  if(!record?.blob&&meta.storagePath){
   const cloud=window.KoujiCloud;if(!cloud?.ready)throw Error('ログイン状態を確認できません');
   const {data:blob,error}=await cloud.client.storage.from('field-pdfs').download(meta.storagePath);if(error)throw error;
   record={id:meta.id,projectId:meta.projectId,fileName:meta.fileName,blob,size:blob.size};
   await savePdfBlob(record);
  }
  if(!record?.blob)return alert('この端末にもクラウドにもPDF本体が見つかりません');
  const u=URL.createObjectURL(record.blob);const w=window.open(u,'_blank');if(!w){const a=document.createElement('a');a.href=u;a.download=record.fileName||meta.fileName;a.click();}setTimeout(()=>URL.revokeObjectURL(u),60000);
 }catch(e){alert('PDFを開けませんでした：'+(e.message||e));}
};
window.addEventListener('message',async event=>{
 if(event.origin!==PHOTO_MAKER_ORIGIN)return;
 const m=event.data;
 if(!m||m.type!=='PHOTO_PDF_READY'||!m.projectId||!(m.pdfBytes instanceof ArrayBuffer))return;
 const project=db.projects.find(p=>p.id===m.projectId);
 if(!project)return;
 try{
  const blob=new Blob([m.pdfBytes],{type:'application/pdf'});
  const record={id:id(),projectId:m.projectId,fileName:m.fileName||'現場写真.pdf',createdAt:new Date().toISOString(),size:blob.size,sizeLabel:fmtBytes(blob.size),blob};
  await savePdfBlob(record);
  const cloud=window.KoujiCloud;if(!cloud?.ready)throw Error('ログイン状態を確認できません。PDFはこの端末に保存しました。');
  const storagePath=cloud.user.id+'/'+m.projectId+'/'+record.id+'.pdf';
  const {error:uploadError}=await cloud.client.storage.from('field-pdfs').upload(storagePath,blob,{contentType:'application/pdf',upsert:false});
  if(uploadError)throw new Error('端末には保存しましたが、クラウドPDF保存に失敗しました：'+uploadError.message);
  db.pdfs.push({id:record.id,projectId:record.projectId,fileName:record.fileName,createdAt:record.createdAt,size:record.size,sizeLabel:record.sizeLabel,storagePath});
  await save();renderProjectPdfs();
  $('pdfSaveStatus').textContent='写真PDFを端末とクラウドに保存しました。他の端末からも開けます。';
  event.source?.postMessage({type:'PHOTO_PDF_SAVED',pdfId:record.id},event.origin);
 }catch(e){
  $('pdfSaveStatus').textContent='自動保存できませんでした：'+(e.message||e);
  event.source?.postMessage({type:'PHOTO_PDF_SAVE_FAILED',message:e.message||String(e)},event.origin);
 }
});
$('openCamera').onclick=()=>{
 const p=db.projects.find(x=>x.id===$('dProject').value);
 if(!p){alert('先に対象現場を選択してください。');return;}
 const u=new URL(PHOTO_MAKER_URL);
 u.searchParams.set('projectId',p.id);u.searchParams.set('projectName',p.name);
 const w=window.open(u.toString(),'photoPdfMaker');
 if(!w)alert('ポップアップがブロックされました。ブラウザーでこのサイトのポップアップを許可してください。');
 $('pdfSaveStatus').textContent='写真PDFメーカーでPDFを作成すると、この現場へ自動保存します。';
};
