<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1457a6"><title>パスワード設定 | 工事管理アプリ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#1d2939;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:520px;margin:8vh auto;padding:16px}.card{background:white;border:1px solid #dce3eb;border-radius:14px;padding:22px}h1{font-size:21px;margin:0 0 10px}p{line-height:1.7;color:#526174}label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:12px 18px;background:#1457a6;color:white;font:inherit;font-weight:700;margin-top:16px}button:disabled{opacity:.5}.status{padding:12px;background:#eef4fb;border-radius:9px;white-space:pre-wrap;margin-top:14px}.error{background:#fff0ef;color:#922b24}
</style></head><body><main class="wrap"><section class="card"><h1>チームアカウントのパスワード設定</h1><p>招待またはパスワード再設定メールから開いた画面です。新しいパスワードを2回入力してください。</p><label for="pw">新しいパスワード（8文字以上）</label><input id="pw" type="password" autocomplete="new-password"><label for="pw2">新しいパスワード（確認）</label><input id="pw2" type="password" autocomplete="new-password"><button id="save" disabled>パスワードを設定</button><div id="status" class="status">認証リンクを確認しています…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CONFIG_KEY='koujiSupabaseConfig_v1',$=id=>document.getElementById(id);let client=null,valid=false;
function msg(t,err=false){$('status').textContent=t;$('status').classList.toggle('error',err)}
(async()=>{try{const c=JSON.parse(localStorage.getItem(CONFIG_KEY)||'null');if(!c?.url||!c?.key)throw Error('この端末にSupabase接続設定がありません。共有設定ページで設定してください。');client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session)throw Error('認証リンクが確認できません。メールのリンクをもう一度開くか、共有設定からパスワード設定メールを再送してください。');valid=true;$('save').disabled=false;msg('認証できました。新しいパスワードを設定してください。')}catch(e){msg(e.message||String(e),true)}})();
$('save').onclick=async()=>{if(!valid)return;const p=$('pw').value,p2=$('pw2').value;if(p.length<8){msg('パスワードは8文字以上にしてください。',true);return}if(p!==p2){msg('2つのパスワードが一致しません。',true);return}$('save').disabled=true;try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;msg('パスワードを設定しました。共有設定ページへ移動します。');setTimeout(()=>location.href='./shared-setup.html',1200)}catch(e){msg('設定できませんでした：'+e.message,true);$('save').disabled=false}};
</script></body></html>
